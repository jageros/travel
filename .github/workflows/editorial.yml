name: Editorial source diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Monitor registered official sources
        run: node scripts/content-pipeline.mjs
      - name: Verify the production site
        env:
          DEPLOYMENT_ENV: production
          SITE_INDEXING_ENABLED: 'true'
        run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-diagnostics
          path: |
            automation/reports/
            automation/review-queue.json
            automation/source-health.json
          retention-days: 30
          if-no-files-found: ignore
